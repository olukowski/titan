name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo fmt --all --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wasm
      - run: cargo check --workspace --target wasm32-unknown-unknown --locked
      - run: cargo test --no-run --workspace --target wasm32-unknown-unknown --locked
      - name: Report breakout_wasm size
        shell: bash
        run: |
          set -euo pipefail
          cargo build --profile wasm --target wasm32-unknown-unknown -p titan --example breakout_wasm --locked
          wasm=target/wasm32-unknown-unknown/wasm/examples/breakout_wasm.wasm
          raw=$(wc -c < "$wasm" | tr -d '[:space:]')
          gz=$(gzip -9 -c "$wasm" | wc -c | tr -d '[:space:]')
          kib() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1024 }'; }
          echo "breakout_wasm.wasm: $raw bytes ($(kib "$raw") KiB) raw, $gz bytes ($(kib "$gz") KiB) gzip -9"
          {
            echo "### breakout_wasm.wasm size (\`--profile wasm\`)"
            echo
            echo "| Encoding | Bytes | KiB |"
            echo "|---|--:|--:|"
            echo "| raw | $raw | $(kib "$raw") |"
            echo "| gzip -9 | $gz | $(kib "$gz") |"
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: macos
      - run: cargo clippy -p titan-macos --all-targets --locked -- -D warnings
      - run: cargo test -p titan-macos --locked
      - run: cargo clippy -p titan --test metal_golden --locked -- -D warnings
      - run: cargo test -p titan --test metal_golden --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version && node --test web/titan.test.mjs

  # Single stable required check for the `main` ruleset.
  ci:
    name: ci
    if: always()
    needs: [fmt, check, wasm, macos, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if jq -e 'all(. == "success")' <<<"$RESULTS" >/dev/null; then
            echo "All required jobs succeeded."
          else
            echo "::error::One or more required jobs did not succeed: $RESULTS"
            exit 1
          fi
