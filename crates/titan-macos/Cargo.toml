[package]
name = "titan-macos"
description = "Titan's macOS backend: an AppKit window, a Metal GPU device, and CoreAudio output in pure Rust, with no dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
titan-app = { path = "../titan-app" }
titan-gpu = { path = "../titan-gpu" }

# Only the macOS modules use these: the runner (`FixedClock`) and audio output (`AudioMixer`).
# Elsewhere `run` is a stub and there is no audio output.
[target.'cfg(target_os = "macos")'.dependencies]
titan-audio = { path = "../titan-audio" }
titan-core = { path = "../titan-core" }

[lints]
workspace = true
